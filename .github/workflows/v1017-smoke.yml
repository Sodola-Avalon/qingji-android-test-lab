name: QingJi v1.0.17 upgrade and update-channel smoke

on:
  push:
    paths:
      - '.github/workflows/v1017-smoke.yml'
      - '.ci/v1.0.17/**'
  workflow_dispatch:

concurrency:
  group: qingji-v1017-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact v1.0.16 and v1.0.17 candidates
        run: |
          set -euo pipefail
          cat .ci/v1.0.16/patch.b64.* | tr -d '\r\n' | base64 -d > v1016.patch.zst
          cp QingJi-v1.0.15.apk v1015.apk
          zstd --patch-from=v1015.apk -d -f v1016.patch.zst -o QingJi-v1.0.16.apk
          echo '8e51e396345d5cc6a4d390bf519d7ba321eafe0c944b30ec9f671b40254ededa  QingJi-v1.0.16.apk' | sha256sum -c -
          tr -d '\r\n' < .ci/v1.0.17/patch.b64 | base64 -d > v1017.patch.zst
          zstd --patch-from=QingJi-v1.0.16.apk -d -f v1017.patch.zst -o QingJi-v1.0.17.apk
          echo 'd03b0521acbc4fa7eaca1dfd988e22312c3018774646a98ad327367bf6d82310  QingJi-v1.0.17.apk' | sha256sum -c -

      - name: Prepare Android 15 emulator
        run: |
          set -euo pipefail
          [ ! -e /dev/kvm ] || sudo chmod 666 /dev/kvm
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          mkdir -p "$HOME/.android/avd"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo no | "$AVDMANAGER" create avd --force --name qingji17 --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6'
          ACCEL='-accel off'; [ ! -e /dev/kvm ] || ACCEL='-accel on'
          nohup "$ANDROID_HOME/emulator/emulator" -avd qingji17 -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect $ACCEL > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for i in $(seq 1 180); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell settings put global stay_on_while_plugged_in 3 || true
          adb shell settings put system screen_off_timeout 1800000
          adb shell wm size 1080x2400
          adb shell wm density 420
          adb shell settings put system font_scale 1.0
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true

      - name: Upgrade from v1.0.16 and verify update channel
        run: |
          set -euo pipefail
          wait_text() {
            local text="$1"; local tries="${2:-40}"
            for i in $(seq 1 "$tries"); do
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              adb pull /sdcard/window.xml window.xml >/dev/null 2>&1 || true
              grep -Fq "$text" window.xml 2>/dev/null && return 0
              sleep .5
            done
            echo "missing UI text: $text" >&2
            adb exec-out screencap -p > failure.png || true
            exit 1
          }
          tap_text() {
            local text="$1"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1
            adb pull /sdcard/window.xml window.xml >/dev/null 2>&1
            python3 - "$text" <<'PY'
import re,sys,xml.etree.ElementTree as ET,subprocess
q=sys.argv[1]
root=ET.parse('window.xml').getroot()
for n in root.iter('node'):
    if q in n.attrib.get('text','') or q in n.attrib.get('content-desc',''):
        m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
        if m:
            x=(int(m.group(1))+int(m.group(3)))//2; y=(int(m.group(2))+int(m.group(4)))//2
            subprocess.check_call(['adb','shell','input','tap',str(x),str(y)])
            raise SystemExit(0)
raise SystemExit('not found: '+q)
PY
          }

          adb install QingJi-v1.0.16.apk
          adb shell pm grant com.qinghao.qingji android.permission.POST_NOTIFICATIONS || true
          adb shell monkey -p com.qinghao.qingji -c android.intent.category.LAUNCHER 1 >/dev/null
          wait_text '添加任务' 60 || wait_text '今天还没有任务' 60
          tap_text '添加任务'
          wait_text '添加' 30
          adb shell input text Upgrade_Persist
          tap_text '添加'
          wait_text 'Upgrade_Persist' 30

          adb install -r QingJi-v1.0.17.apk
          adb shell monkey -p com.qinghao.qingji -c android.intent.category.LAUNCHER 1 >/dev/null
          wait_text 'Upgrade_Persist' 60
          adb shell dumpsys package com.qinghao.qingji | grep -q 'versionName=1.0.17'

          tap_text '设置'
          wait_text '检查更新' 60
          wait_text 'V1.0.17' 30
          tap_text '检查更新'
          wait_text '暂时没有正式发布版本' 60
          adb exec-out screencap -p > update-channel-result.png
          echo SMOKE_PASS > result.txt

      - name: Collect diagnostics
        if: always()
        run: |
          timeout 8s adb logcat -d -v time > logcat.txt 2>&1 || true
          timeout 8s adb shell dumpsys package com.qinghao.qingji > package.txt 2>&1 || true
          sha256sum QingJi-v1.0.17.apk > candidate-sha256.txt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingji-v1.0.17-smoke
          path: |
            result.txt
            update-channel-result.png
            failure.png
            logcat.txt
            package.txt
            candidate-sha256.txt
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 5
