name: QingJi v1.0.17 adversarial regression

on:
  push:
    paths:
      - '.github/workflows/v1017-adversarial.yml'
  workflow_dispatch:

concurrency:
  group: qingji-v1017-adversarial
  cancel-in-progress: true

jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact v1.0.16 and v1.0.17
        run: |
          set -euo pipefail
          cat .ci/v1.0.16/patch.b64.?? | tr -d '\r\n' | base64 -d > v1016.patch.zst
          cp QingJi-v1.0.15.apk v1015.apk
          zstd --patch-from=v1015.apk -d -f v1016.patch.zst -o QingJi-v1.0.16.apk
          echo '8e51e396345d5cc6a4d390bf519d7ba321eafe0c944b30ec9f671b40254ededa  QingJi-v1.0.16.apk' | sha256sum -c -
          python3 -c "from pathlib import Path; p=Path('.ci/v1.0.17/patch.b64.01'); s=p.read_text(); assert len(s)==12000 and s[7829]=='t'; p.write_text(s[:7829]+'T'+s[7830:])"
          echo '0aa0eb591f6795af3722429480c5700e7622dde8111c7130123d81fc5cd7fb87  .ci/v1.0.17/patch.b64.01' | sha256sum -c -
          cat .ci/v1.0.17/patch.b64.0[0-9] | base64 -d -i > v1017.patch.zst
          zstd --patch-from=QingJi-v1.0.16.apk -d -f v1017.patch.zst -o QingJi-v1.0.17.apk
          echo 'd03b0521acbc4fa7eaca1dfd988e22312c3018774646a98ad327367bf6d82310  QingJi-v1.0.17.apk' | sha256sum -c -

      - name: Locate Android tools
        run: |
          set -euo pipefail
          [ ! -e /dev/kvm ] || sudo chmod 666 /dev/kvm
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          test -x "$SDKMANAGER"; test -x "$AVDMANAGER"
          mkdir -p "$HOME/.android/avd"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Install Android 15 image
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'

      - name: Create AVD
        run: |
          set -euo pipefail
          echo no | "$AVDMANAGER" create avd --force --name qingji17adv --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6'
          "$AVDMANAGER" list avd

      - name: Boot emulator
        run: |
          set -euo pipefail
          ACCEL='-accel off'; [ ! -e /dev/kvm ] || ACCEL='-accel on'
          nohup "$ANDROID_HOME/emulator/emulator" -avd qingji17adv -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect $ACCEL > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for i in $(seq 1 180); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell settings put global stay_on_while_plugged_in 3 || true
          adb shell settings put system screen_off_timeout 1800000
          adb shell wm size 1080x2400
          adb shell wm density 420
          adb shell settings put system font_scale 1.0
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell input keyevent KEYCODE_HOME || true
          sleep 1

      - name: Install exact v1.0.17 candidate
        run: |
          set -euo pipefail
          adb install -r QingJi-v1.0.17.apk
          adb shell dumpsys package com.qinghao.qingji | grep -q 'versionName=1.0.17'

      - name: Run four proven adversarial rounds against v1.0.17
        run: |
          chmod +x .ci/v1.0.16/run-adversarial-v7.sh
          .ci/v1.0.16/run-adversarial-v7.sh

      - name: Collect diagnostics
        if: always()
        run: |
          timeout 8s adb shell dumpsys package com.qinghao.qingji > package.txt 2>&1 || true
          timeout 8s adb shell dumpsys alarm > alarms-final.txt 2>&1 || true
          timeout 8s adb shell dumpsys notification --noredact > notifications-final.txt 2>&1 || true
          timeout 8s adb shell cmd appops get com.qinghao.qingji > appops-final.txt 2>&1 || true
          timeout 8s adb logcat -d -v time > logcat-final.txt 2>&1 || true
          sha256sum QingJi-v1.0.17.apk > candidate-sha256.txt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingji-v1.0.17-adversarial
          path: |
            r1-*
            r2-*
            r3-*
            r4-*
            wait-failed.xml
            reminder-targets.txt
            package.txt
            alarms-final.txt
            notifications-final.txt
            appops-final.txt
            logcat-final.txt
            candidate-sha256.txt
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 5
