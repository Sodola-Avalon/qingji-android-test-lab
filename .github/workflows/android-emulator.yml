name: QingJi Android emulator test

on:
  workflow_dispatch:
  push:
    paths:
      - '*.apk'
      - '.github/workflows/android-emulator.yml'

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare KVM
        shell: bash
        run: |
          set -e
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo 'KVM is available.'
          else
            echo 'KVM is not available; emulator will use software acceleration.'
          fi

      - name: Download Android test runtime from SwissTransfer
        env:
          TRANSFER_UUID: c175ef65-584e-4ece-b0be-0cf9a6a11faa
        shell: bash
        run: |
          set -euo pipefail
          API='https://swisstransfer.infomaniak.com/api/1'
          mkdir -p "$RUNNER_TEMP/qingji-runtime"
          curl -fL --retry 5 "$API/links/$TRANSFER_UUID?with=transfer" -o "$RUNNER_TEMP/transfer.json"
          LINK_ID="$(jq -r '.data.id' "$RUNNER_TEMP/transfer.json")"
          while IFS=$'\t' read -r ID PATH SIZE; do
            NAME="$(basename "$PATH")"
            curl -fL --retry 5 "$API/links/$LINK_ID/files/$ID" -o "$RUNNER_TEMP/presigned.json"
            URL="$(jq -r '.data.url' "$RUNNER_TEMP/presigned.json")"
            curl -fL --retry 5 --retry-all-errors "$URL" -o "$RUNNER_TEMP/qingji-runtime/$NAME"
            ACTUAL="$(stat -c '%s' "$RUNNER_TEMP/qingji-runtime/$NAME")"
            test "$ACTUAL" = "$SIZE"
          done < <(jq -r '.data.transfer.files[] | [.id,.path,(.size|tostring)] | @tsv' "$RUNNER_TEMP/transfer.json")
          ls -lh "$RUNNER_TEMP/qingji-runtime"

      - name: Install emulator runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/android-runtime"
          mkdir -p "$ROOT" "$ROOT/system-images/android-35/google_apis"
          unzip -q "$RUNNER_TEMP/qingji-runtime/platform-tools-latest-linux.zip" -d "$ROOT"
          unzip -q "$RUNNER_TEMP/qingji-runtime/emulator-linux_x64-15261927.zip" -d "$ROOT"
          unzip -q "$RUNNER_TEMP/qingji-runtime/x86_64-35_r09.zip" -d "$ROOT/system-images/android-35/google_apis"
          chmod +x "$ROOT/platform-tools/adb" "$ROOT/emulator/emulator"
          echo "$ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ROOT/emulator" >> "$GITHUB_PATH"
          echo "ANDROID_RUNTIME=$ROOT" >> "$GITHUB_ENV"

      - name: Create AVD configuration
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_DIR="$(find "$ANDROID_RUNTIME/system-images/android-35/google_apis" -maxdepth 2 -type f -name system.img -printf '%h\n' | head -1)"
          test -n "$IMAGE_DIR"
          mkdir -p "$HOME/.android/avd/qingji.avd"
          cat > "$HOME/.android/avd/qingji.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$HOME/.android/avd/qingji.avd
          path.rel=avd/qingji.avd
          target=android-35
          EOF
          cat > "$HOME/.android/avd/qingji.avd/config.ini" <<EOF
          AvdId=qingji
          PlayStore.enabled=false
          abi.type=x86_64
          avd.ini.displayname=QingJi API 35
          disk.dataPartition.size=6G
          fastboot.forceColdBoot=yes
          fastboot.forceFastBoot=no
          hw.accelerometer=yes
          hw.audioInput=no
          hw.battery=yes
          hw.cpu.arch=x86_64
          hw.cpu.ncore=4
          hw.device.name=pixel_6
          hw.gps=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=auto
          hw.keyboard=yes
          hw.lcd.density=420
          hw.lcd.height=2400
          hw.lcd.width=1080
          hw.ramSize=3072
          image.sysdir.1=$IMAGE_DIR
          runtime.network.latency=none
          runtime.network.speed=full
          skin.dynamic=yes
          tag.id=google_apis
          tag.display=Google APIs
          target=android-35
          vm.heapSize=512
          EOF

      - name: Boot emulator
        shell: bash
        run: |
          set -euo pipefail
          ACCEL='-accel off'
          if [ -e /dev/kvm ]; then ACCEL='-accel on'; fi
          nohup emulator -avd qingji -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect $ACCEL > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for i in $(seq 1 180); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$BOOT" = '1' ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell input keyevent 82 || true
          adb shell settings put system screen_off_timeout 1800000
          adb shell wm size 1080x2400
          adb shell wm density 420
          adb shell screencap -p /sdcard/emulator-home.png
          adb pull /sdcard/emulator-home.png emulator-home.png

      - name: Install and launch QingJi APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -maxdepth 2 -type f -name '*.apk' | head -1 || true)"
          if [ -z "$APK" ]; then
            echo 'No APK is present in the repository yet. Emulator boot test passed.'
            exit 0
          fi
          adb install -r "$APK"
          adb shell pm grant com.qinghao.qingji android.permission.POST_NOTIFICATIONS || true
          adb shell monkey -p com.qinghao.qingji -c android.intent.category.LAUNCHER 1
          sleep 3
          adb shell uiautomator dump /sdcard/window.xml || true
          adb pull /sdcard/window.xml window.xml || true
          adb shell screencap -p /sdcard/qingji-home.png
          adb pull /sdcard/qingji-home.png qingji-home.png
          adb shell dumpsys package com.qinghao.qingji > package.txt
          adb shell dumpsys alarm | grep -i -C 5 qingji > alarms.txt || true
          adb logcat -d -v time > logcat.txt

      - name: Upload small test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingji-emulator-results
          path: |
            emulator-home.png
            qingji-home.png
            window.xml
            package.txt
            alarms.txt
            logcat.txt
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 3
