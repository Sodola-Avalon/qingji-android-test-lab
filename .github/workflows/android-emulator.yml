name: QingJi Android emulator test

on:
  workflow_dispatch:
  push:
    paths:
      - '*.apk'
      - '.github/workflows/android-emulator.yml'

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare KVM
        shell: bash
        run: |
          set -e
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo 'KVM is available.'
          fi

      - name: Locate Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          mkdir -p "$HOME/.android/avd"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Install Android 15 emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'

      - name: Create AVD
        shell: bash
        run: |
          set -euo pipefail
          echo no | "$AVDMANAGER" create avd --force --name qingji \
            --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6'

      - name: Boot emulator
        shell: bash
        run: |
          set -euo pipefail
          ACCEL='-accel off'
          if [ -e /dev/kvm ]; then ACCEL='-accel on'; fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd qingji \
            -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect $ACCEL > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for i in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell settings put global stay_on_while_plugged_in 3 || true
          adb shell settings put system screen_off_timeout 1800000
          adb shell wm size 1080x2400
          adb shell wm density 420
          adb shell settings put system font_scale 1.0
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell input keyevent KEYCODE_HOME || true
          sleep 2
          adb exec-out screencap -p > emulator-home.png

      - name: Install and launch QingJi APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -maxdepth 2 -type f -name '*.apk' | head -1)"
          adb install -r "$APK"
          adb shell pm grant com.qinghao.qingji android.permission.POST_NOTIFICATIONS || true
          adb shell appops set com.qinghao.qingji SCHEDULE_EXACT_ALARM allow > exact-alarm-grant.txt 2>&1 || true
          adb shell appops get com.qinghao.qingji SCHEDULE_EXACT_ALARM >> exact-alarm-grant.txt 2>&1 || true
          adb logcat -c
          adb shell monkey -p com.qinghao.qingji -c android.intent.category.LAUNCHER 1
          sleep 3
          adb shell uiautomator dump /data/local/tmp/window.xml >/dev/null || true
          adb exec-out cat /data/local/tmp/window.xml > window.xml || true
          adb exec-out screencap -p > qingji-home.png

      - name: Capture vertical paging previews
        shell: bash
        run: |
          set -u
          # Keep the swipe command alive in the background so the screenshot is taken before ACTION_UP.
          adb shell input swipe 540 900 540 1400 2200 >/dev/null 2>&1 &
          P=$!
          sleep 1.15
          adb exec-out screencap -p > pull-previous.png || true
          wait $P || true
          sleep 1

          adb shell input swipe 540 1550 540 1000 2200 >/dev/null 2>&1 &
          P=$!
          sleep 1.15
          adb exec-out screencap -p > pull-next.png || true
          wait $P || true
          sleep 1

          # Return to today in case a swipe crossed the threshold and switched dates.
          adb shell input tap 930 2090 || true
          sleep 1

      - name: Create a task reminder through the real UI
        shell: bash
        run: |
          set -euo pipefail

          dump_ui() {
            adb shell uiautomator dump /data/local/tmp/current-ui.xml >/dev/null 2>&1 || true
            adb exec-out cat /data/local/tmp/current-ui.xml > current-ui.xml
          }

          center_by() {
            local attr="$1" value="$2"
            dump_ui
            python3 - "$attr" "$value" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          attr, value = sys.argv[1], sys.argv[2]
          root = ET.parse('current-ui.xml').getroot()
          for n in root.iter('node'):
              if n.attrib.get(attr, '') == value:
                  m = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib.get('bounds',''))
                  if m:
                      x1,y1,x2,y2 = map(int,m.groups())
                      print((x1+x2)//2, (y1+y2)//2)
                      raise SystemExit(0)
          raise SystemExit(2)
          PY
          }

          tap_by() {
            read -r X Y < <(center_by "$1" "$2")
            adb shell input tap "$X" "$Y"
          }

          # Target is three minutes ahead so there is time to finish UI automation and kill the process.
          H="$(adb shell date +%H | tr -d '\r')"
          M="$(adb shell date +%M | tr -d '\r')"
          NOW_MIN=$((10#$H * 60 + 10#$M))
          TARGET_MIN=$(((NOW_MIN + 3) % 1440))
          TH=$((TARGET_MIN / 60))
          TM=$((TARGET_MIN % 60))
          printf -v TH2 '%02d' "$TH"
          printf -v TM2 '%02d' "$TM"
          echo "device_now=$H:$M target=$TH2:$TM2" | tee reminder-target.txt

          # Add dialog and name.
          tap_by content-desc '添加任务，长按打开快捷功能'
          sleep 0.7
          adb shell input text CI_Reminder
          sleep 0.3
          adb shell uiautomator dump /data/local/tmp/add-dialog.xml >/dev/null || true
          adb exec-out cat /data/local/tmp/add-dialog.xml > add-dialog.xml || true
          adb exec-out screencap -p > add-dialog.png

          # Open reminder picker and switch to numeric input mode.
          tap_by text '无'
          sleep 0.7
          adb shell uiautomator dump /data/local/tmp/time-picker.xml >/dev/null || true
          adb exec-out cat /data/local/tmp/time-picker.xml > time-picker.xml || true
          adb exec-out screencap -p > time-picker.png
          tap_by content-desc 'Switch to text input mode for the time input.'
          sleep 0.5
          adb shell uiautomator dump /data/local/tmp/time-input.xml >/dev/null || true
          adb exec-out cat /data/local/tmp/time-input.xml > time-input.xml || true
          adb exec-out screencap -p > time-input.png || true

          # Set hour field.
          if center_by resource-id 'android:id/input_hour' >/tmp/hour-center 2>/dev/null; then
            read -r X Y < /tmp/hour-center
          else
            read -r X Y < <(center_by resource-id 'android:id/hours')
          fi
          adb shell input tap "$X" "$Y"
          adb shell input keyevent KEYCODE_MOVE_END
          adb shell input keyevent KEYCODE_DEL KEYCODE_DEL KEYCODE_DEL || true
          adb shell input text "$TH2"

          # Set minute field.
          if center_by resource-id 'android:id/input_minute' >/tmp/min-center 2>/dev/null; then
            read -r X Y < /tmp/min-center
          else
            read -r X Y < <(center_by resource-id 'android:id/minutes')
          fi
          adb shell input tap "$X" "$Y"
          adb shell input keyevent KEYCODE_MOVE_END
          adb shell input keyevent KEYCODE_DEL KEYCODE_DEL KEYCODE_DEL || true
          adb shell input text "$TM2"
          adb shell input keyevent KEYCODE_BACK || true
          sleep 0.3
          tap_by text 'OK'
          sleep 0.7

          # Save task.
          adb shell uiautomator dump /data/local/tmp/add-ready.xml >/dev/null || true
          adb exec-out cat /data/local/tmp/add-ready.xml > add-ready.xml || true
          adb exec-out screencap -p > add-ready.png || true
          tap_by text '添加'
          sleep 1

          # If special access dialog appears despite appops, choose 暂不 so the test still continues.
          dump_ui
          if grep -q '允许准点提醒' current-ui.xml; then
            tap_by text '暂不' || true
            sleep 0.5
          fi

          adb exec-out screencap -p > task-created.png || true
          adb shell dumpsys alarm > alarms-before-kill.txt
          grep -i -C 12 'com.qinghao.qingji\|QingJi' alarms-before-kill.txt > qingji-alarms-before-kill.txt || true

      - name: Verify reminder survives app process death
        shell: bash
        run: |
          set -u
          adb shell input keyevent KEYCODE_HOME || true
          sleep 0.5
          adb shell am kill com.qinghao.qingji || true
          sleep 1
          adb shell dumpsys alarm > alarms-after-kill.txt
          grep -i -C 12 'com.qinghao.qingji\|QingJi' alarms-after-kill.txt > qingji-alarms-after-kill.txt || true

          echo 'waiting for QingJiReminder receiver...' | tee reminder-result.txt
          FIRED=0
          for i in $(seq 1 50); do
            adb logcat -d -v brief -s QingJiReminder:I '*:S' > reminder-live.txt 2>&1 || true
            if grep -q 'notification posted' reminder-live.txt; then
              FIRED=1
              echo "PASS: notification posted after app process was killed (poll=$i)." | tee -a reminder-result.txt
              break
            fi
            sleep 5
          done
          if [ "$FIRED" -ne 1 ]; then
            echo 'FAIL: no notification posted within test window.' | tee -a reminder-result.txt
          fi

          adb shell dumpsys notification --noredact > notifications-after.txt 2>&1 || true
          grep -i -C 15 'com.qinghao.qingji\|CI_Reminder' notifications-after.txt > qingji-notification-after.txt || true
          adb shell cmd statusbar expand-notifications || true
          sleep 1
          adb exec-out screencap -p > notification-shade.png || true
          adb shell cmd statusbar collapse || true
          test "$FIRED" -eq 1

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          adb shell dumpsys package com.qinghao.qingji > package.txt 2>&1 || true
          adb shell dumpsys alarm > alarms-full.txt 2>&1 || true
          grep -i -C 12 'com.qinghao.qingji\|QingJi' alarms-full.txt > alarms.txt || true
          adb shell dumpsys notification --noredact > notifications.txt 2>&1 || true
          adb shell cmd appops get com.qinghao.qingji > appops-all.txt 2>&1 || true
          adb logcat -d -v time > logcat.txt 2>&1 || true
          adb logcat -d -v time -s QingJiReminder:I '*:S' > qingji-reminder.txt 2>&1 || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingji-emulator-results
          path: |
            *.png
            *.xml
            *.txt
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 3
