name: QingJi Android emulator test

on:
  workflow_dispatch:
  push:
    paths:
      - '*.apk'
      - '.github/workflows/android-emulator.yml'

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare KVM
        shell: bash
        run: |
          set -e
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo 'KVM is available.'
          else
            echo 'KVM is not available; emulator will use software acceleration.'
          fi

      - name: Locate Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          mkdir -p "$HOME/.android/avd"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Install Android 15 emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            'platform-tools' \
            'emulator' \
            'system-images;android-35;google_apis;x86_64'

      - name: Create AVD
        shell: bash
        run: |
          set -euo pipefail
          echo no | "$AVDMANAGER" create avd \
            --force \
            --name qingji \
            --package 'system-images;android-35;google_apis;x86_64' \
            --device 'pixel_6'
          "$AVDMANAGER" list avd

      - name: Boot emulator
        shell: bash
        run: |
          set -euo pipefail
          ACCEL='-accel off'
          if [ -e /dev/kvm ]; then ACCEL='-accel on'; fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd qingji \
            -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect $ACCEL \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for i in $(seq 1 180); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$BOOT" = '1' ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell settings put global stay_on_while_plugged_in 3 || true
          adb shell settings put system screen_off_timeout 1800000
          adb shell wm size 1080x2400
          adb shell wm density 420
          adb shell settings put system font_scale 1.0
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell input swipe 540 1900 540 500 300 || true
          adb shell input keyevent KEYCODE_HOME || true
          sleep 2
          adb exec-out screencap -p > emulator-home.png
          test -s emulator-home.png
          echo "Android 15 emulator booted successfully."

      - name: Install and launch QingJi APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -maxdepth 2 -type f -name '*.apk' | head -1 || true)"
          if [ -z "$APK" ]; then
            echo 'No APK is present in the repository yet. Emulator boot test passed.'
            exit 0
          fi
          echo "Testing APK: $APK"
          adb install -r "$APK"
          adb shell pm grant com.qinghao.qingji android.permission.POST_NOTIFICATIONS || true
          adb logcat -c
          adb shell monkey -p com.qinghao.qingji -c android.intent.category.LAUNCHER 1
          sleep 3
          adb shell uiautomator dump /data/local/tmp/window.xml || true
          adb pull /data/local/tmp/window.xml window.xml || true
          adb exec-out screencap -p > qingji-home.png
          test -s qingji-home.png
          adb shell dumpsys package com.qinghao.qingji > package.txt
          adb shell dumpsys alarm | grep -i -C 8 qingji > alarms.txt || true
          adb logcat -d -v time > logcat.txt

      - name: Upload small test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingji-emulator-results
          path: |
            emulator-home.png
            qingji-home.png
            window.xml
            package.txt
            alarms.txt
            logcat.txt
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 3
