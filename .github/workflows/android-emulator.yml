name: QingJi Android emulator test

on:
  workflow_dispatch:
  push:
    paths:
      - '*.apk'
      - '.github/workflows/android-emulator.yml'

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare KVM
        shell: bash
        run: |
          set -e
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo 'KVM is available.'
          else
            echo 'KVM is not available; emulator will use software acceleration.'
          fi

      - name: Locate Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          AVDMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name avdmanager | sort | tail -1)"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          mkdir -p "$HOME/.android/avd"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Install Android 15 emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            'platform-tools' \
            'emulator' \
            'system-images;android-35;google_apis;x86_64'

      - name: Create AVD
        shell: bash
        run: |
          set -euo pipefail
          echo no | "$AVDMANAGER" create avd \
            --force \
            --name qingji \
            --package 'system-images;android-35;google_apis;x86_64' \
            --device 'pixel_6'
          "$AVDMANAGER" list avd

      - name: Boot emulator
        shell: bash
        run: |
          set -euo pipefail
          ACCEL='-accel off'
          if [ -e /dev/kvm ]; then ACCEL='-accel on'; fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd qingji \
            -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect $ACCEL \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for i in $(seq 1 180); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$BOOT" = '1' ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell settings put global stay_on_while_plugged_in 3 || true
          adb shell settings put system screen_off_timeout 1800000
          adb shell wm size 1080x2400
          adb shell wm density 420
          adb shell settings put system font_scale 1.0
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell input swipe 540 1900 540 500 300 || true
          adb shell input keyevent KEYCODE_HOME || true
          sleep 2
          adb exec-out screencap -p > emulator-home.png
          test -s emulator-home.png

      - name: Install and launch QingJi APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find . -maxdepth 2 -type f -name '*.apk' | head -1 || true)"
          test -n "$APK"
          echo "Testing APK: $APK"
          adb install -r "$APK"
          adb shell pm grant com.qinghao.qingji android.permission.POST_NOTIFICATIONS || true
          adb shell cmd appops get com.qinghao.qingji SCHEDULE_EXACT_ALARM > appops-before.txt 2>&1 || true
          adb logcat -c
          adb shell monkey -p com.qinghao.qingji -c android.intent.category.LAUNCHER 1
          sleep 3
          adb shell uiautomator dump /data/local/tmp/window.xml || true
          adb exec-out cat /data/local/tmp/window.xml > window.xml || true
          adb exec-out screencap -p > qingji-home.png
          test -s qingji-home.png

      - name: Exercise vertical paging preview
        shell: bash
        run: |
          set -u
          # Pull down: previous day. Keep finger down while taking the screenshot.
          adb shell input motionevent DOWN 540 900 || true
          adb shell input motionevent MOVE 540 1280 || true
          sleep 0.25
          adb exec-out screencap -p > pull-previous.png || true
          adb shell input motionevent UP 540 1280 || true
          sleep 1

          # Pull up: next day. Keep finger down while taking the screenshot.
          adb shell input motionevent DOWN 540 1550 || true
          adb shell input motionevent MOVE 540 1170 || true
          sleep 0.25
          adb exec-out screencap -p > pull-next.png || true
          adb shell input motionevent UP 540 1170 || true
          sleep 1

      - name: Inspect add-task and reminder dialogs
        shell: bash
        run: |
          set -u
          # Open Add Task.
          adb shell input tap 935 2190 || true
          sleep 1
          adb shell uiautomator dump /data/local/tmp/add-dialog.xml || true
          adb exec-out cat /data/local/tmp/add-dialog.xml > add-dialog.xml || true
          adb exec-out screencap -p > add-dialog.png || true

          # The reminder value sits at the right side of the reminder row on a 1080x2400 Pixel 6 profile.
          adb shell input tap 890 1390 || true
          sleep 1
          adb shell uiautomator dump /data/local/tmp/time-picker.xml || true
          adb exec-out cat /data/local/tmp/time-picker.xml > time-picker.xml || true
          adb exec-out screencap -p > time-picker.png || true

          # Back out without modifying user data.
          adb shell input keyevent KEYCODE_BACK || true
          sleep 0.5
          adb shell input keyevent KEYCODE_BACK || true
          sleep 0.5

      - name: Collect reminder diagnostics
        if: always()
        shell: bash
        run: |
          adb shell dumpsys package com.qinghao.qingji > package.txt 2>&1 || true
          adb shell dumpsys alarm > alarms-full.txt 2>&1 || true
          grep -i -C 12 'com.qinghao.qingji\|QingJi' alarms-full.txt > alarms.txt || true
          adb shell dumpsys notification --noredact > notifications.txt 2>&1 || true
          adb shell cmd appops get com.qinghao.qingji > appops-all.txt 2>&1 || true
          adb shell dumpsys deviceidle > deviceidle.txt 2>&1 || true
          adb shell dumpsys activity processes | grep -i -C 8 qinghao > process.txt || true
          adb logcat -d -v time > logcat.txt 2>&1 || true
          grep -Ei 'QingJiReminder|com\.qinghao\.qingji|AlarmManager|NotificationManager' logcat.txt > qingji-diagnostic.txt || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingji-emulator-results
          path: |
            emulator-home.png
            qingji-home.png
            pull-previous.png
            pull-next.png
            add-dialog.png
            time-picker.png
            window.xml
            add-dialog.xml
            time-picker.xml
            package.txt
            appops-before.txt
            appops-all.txt
            alarms.txt
            alarms-full.txt
            notifications.txt
            deviceidle.txt
            process.txt
            logcat.txt
            qingji-diagnostic.txt
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
          retention-days: 3
